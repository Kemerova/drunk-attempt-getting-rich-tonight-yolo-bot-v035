<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Bot Dashboard - Watching Money Disappear</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .status-card {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #444;
        }
        .status-card h3 {
            margin: 0 0 10px 0;
            color: #00ff88;
        }
        .status-card .value {
            font-size: 24px;
            font-weight: bold;
        }
        .positive { color: #00ff88; }
        .negative { color: #ff4444; }
        .neutral { color: #ffaa00; }
        
        .chart-container {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid #444;
        }
        
        .positions-table, .trades-table {
            width: 100%;
            border-collapse: collapse;
            background: #2d2d2d;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .positions-table th, .trades-table th,
        .positions-table td, .trades-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #444;
        }
        
        .positions-table th, .trades-table th {
            background: #333;
            font-weight: bold;
            color: #00ff88;
        }
        
        .running { color: #00ff88; }
        .stopped { color: #ff4444; }
        
        .refresh-btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px;
        }
        
        .refresh-btn:hover {
            background: #00cc66;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍺 Drunk YOLO Bot Dashboard V0.35</h1>
            <p style="color: #ffaa00; font-size: 14px;">⚠️ Untested code - probably broken</p>
            <button class="refresh-btn" onclick="refreshData()">Refresh Regret</button>
            <span id="lastUpdate"></span>
        </div>
        
        <div class="status-grid" id="statusGrid">
            <!-- Status cards will be populated by JavaScript -->
        </div>
        
        <div class="chart-container">
            <h2>Cumulative PnL</h2>
            <div id="pnlChart"></div>
        </div>
        
        <div>
            <h2>Current Positions</h2>
            <table class="positions-table" id="positionsTable">
                <thead>
                    <tr>
                        <th>Token</th>
                        <th>Quantity</th>
                        <th>Cost (SOL)</th>
                        <th>Current Price</th>
                        <th>Unrealized PnL</th>
                        <th>Entry Time</th>
                    </tr>
                </thead>
                <tbody id="positionsBody">
                </tbody>
            </table>
        </div>
        
        <div>
            <h2>Recent Trades</h2>
            <table class="trades-table" id="tradesTable">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Token</th>
                        <th>PnL (SOL)</th>
                        <th>Score</th>
                        <th>Age (days)</th>
                    </tr>
                </thead>
                <tbody id="tradesBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let refreshInterval;
        
        async function fetchData(endpoint) {
            try {
                const response = await fetch(`/api/${endpoint}`);
                return await response.json();
            } catch (error) {
                console.error(`Error fetching ${endpoint}:`, error);
                return null;
            }
        }
        
        function formatNumber(num, decimals = 6) {
            if (num === null || num === undefined) return 'N/A';
            return Number(num).toFixed(decimals);
        }
        
        function formatTime(timestamp) {
            if (!timestamp) return 'N/A';
            return new Date(timestamp).toLocaleString();
        }
        
        function getValueClass(value) {
            if (value > 0) return 'positive';
            if (value < 0) return 'negative';
            return 'neutral';
        }
        
        async function updateStatus() {
            const data = await fetchData('status');
            if (!data) return;
            
            const statusGrid = document.getElementById('statusGrid');
            const metrics = data.metrics;
            const portfolio = data.portfolio;
            
            statusGrid.innerHTML = `
                <div class="status-card">
                    <h3>Bot Status</h3>
                    <div class="value ${data.status.running ? 'running' : 'stopped'}">
                        ${data.status.running ? 'RUNNING' : 'STOPPED'}
                    </div>
                </div>
                <div class="status-card">
                    <h3>Total PnL</h3>
                    <div class="value ${getValueClass(metrics.total_pnl)}">
                        ${formatNumber(metrics.total_pnl)} SOL
                    </div>
                </div>
                <div class="status-card">
                    <h3>Win Rate</h3>
                    <div class="value ${getValueClass(metrics.win_rate - 50)}">
                        ${formatNumber(metrics.win_rate, 1)}%
                    </div>
                </div>
                <div class="status-card">
                    <h3>Total Trades</h3>
                    <div class="value neutral">
                        ${metrics.total_trades}
                    </div>
                </div>
                <div class="status-card">
                    <h3>Daily Spent</h3>
                    <div class="value neutral">
                        ${formatNumber(portfolio.daily_spent || 0)} SOL
                    </div>
                </div>
                <div class="status-card">
                    <h3>Sharpe Ratio</h3>
                    <div class="value ${getValueClass(metrics.sharpe_ratio)}">
                        ${formatNumber(metrics.sharpe_ratio, 2)}
                    </div>
                </div>
            `;
            
            document.getElementById('lastUpdate').textContent = 
                `Last updated: ${formatTime(data.timestamp)}`;
        }
        
        async function updatePnLChart() {
            const chartData = await fetchData('chart/pnl');
            if (chartData && Object.keys(chartData).length > 0) {
                Plotly.newPlot('pnlChart', chartData.data, chartData.layout);
            }
        }
        
        async function updatePositions() {
            const positions = await fetchData('positions');
            if (!positions) return;
            
            const tbody = document.getElementById('positionsBody');
            tbody.innerHTML = '';
            
            Object.entries(positions).forEach(([mint, pos]) => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${mint.substring(0, 8)}...</td>
                    <td>${formatNumber(pos.qty, 0)}</td>
                    <td>${formatNumber(pos.cost_sol)}</td>
                    <td>${formatNumber(pos.current_price)}</td>
                    <td class="${getValueClass(pos.unrealized_pnl)}">
                        ${formatNumber(pos.unrealized_pnl)}
                    </td>
                    <td>${formatTime(pos.entry_ts * 1000)}</td>
                `;
            });
        }
        
        async function updateTrades() {
            const trades = await fetchData('trades');
            if (!trades) return;
            
            const tbody = document.getElementById('tradesBody');
            tbody.innerHTML = '';
            
            trades.slice(-20).reverse().forEach(trade => {
                if (trade.pnl !== null && trade.pnl !== undefined) {
                    const row = tbody.insertRow();
                    row.innerHTML = `
                        <td>${formatTime(trade.timestamp)}</td>
                        <td>${(trade.mint || '').substring(0, 8)}...</td>
                        <td class="${getValueClass(trade.pnl)}">
                            ${formatNumber(trade.pnl)}
                        </td>
                        <td>${formatNumber(trade.score || 0, 3)}</td>
                        <td>${formatNumber(trade.age_days || 0, 1)}</td>
                    `;
                }
            });
        }
        
        async function refreshData() {
            await Promise.all([
                updateStatus(),
                updatePnLChart(),
                updatePositions(),
                updateTrades()
            ]);
        }
        
        // Initial load and set up auto-refresh
        refreshData();
        refreshInterval = setInterval(refreshData, 10000); // Refresh every 10 seconds
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
